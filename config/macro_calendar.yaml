# Static macro calendar: FOMC decision days and the US data releases that move the market.
# Committed reference data (like news_playbook.yaml), read by src/common/macro_calendar.py.
# Covers 2026-11-14 to 2027-12-31. One row per event: day (ET calendar date), kind
# (FOMC | CPI | PPI | NFP | PCE), time_et (HH:MM ET), source (the agency page the date was read from).
# Sources, read 2026-11-14 (never copied from an aggregator):
#   FOMC  https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm  (the decision day is the second day of each meeting; the page lists no
#         December 2027 meeting yet, so none is recorded; "tentative until confirmed at the meeting
#         immediately preceding it")
#   CPI   https://www.bls.gov/schedule/news_release/cpi.htm
#   PPI   https://www.bls.gov/schedule/news_release/ppi.htm
#   NFP   https://www.bls.gov/schedule/news_release/empsit.htm   (Employment Situation)
#   PCE   https://www.bea.gov/news/schedule (2026) and https://www.bea.gov/news/schedule/next-year (2027)   (BEA Personal Income and Outlays)
# Refresh when the agencies publish more (BLS and BEA schedules are fixed a year ahead; the Fed
# adds a year each summer). Rows must stay sorted by day.
