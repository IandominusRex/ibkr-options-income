# Connection, scheduling, and process-level settings.
# Secrets live in .env, NOT here.

ibkr:
  host: "127.0.0.1"
  # Paper TWS: 7497 | Live TWS: 7496 | Paper Gateway: 4002 | Live Gateway: 4001
  paper_port: 4002
  live_port: 4001
  # One clientId per process to avoid conflicts. The trading_skills MCP and the
  # dashboard must each use a DIFFERENT id from these.
  client_ids:
    engine: 11        # orchestrator / morning scan
    monitor: 12       # intraday event loop
    backfill: 13      # historical IV backfill script
    exec: 14          # execution engine order-placement (approval_service daemon)
    scan: 15          # market data fetch during /scan command (approval_service daemon)
    healthcheck: 19
    # trading_skills MCP should be configured with clientId 20 (see .mcp.json)
    # dashboard should use clientId 21
  # 1 = real-time, 2 = frozen, 3 = delayed, 4 = delayed-frozen.
  # 3 = delayed: IBKR serves 15-min delayed bid/ask for symbols without a real-time
  # subscription. Required for paper trading — without this, symbols lacking a paid
  # OPRA/exchange subscription return error 10091 and send no bid/ask, causing
  # strict_mid=None and all candidates for those symbols to be filtered out.
  # Switch to 1 only if you have verified real-time option subscriptions for every
  # scanned symbol; even then, IBKR does NOT auto-fallback to delayed on error 10091
  # when type=1 is set.
  market_data_type: 1
  connect_timeout_seconds: 15
  reconnect:
    max_retries: 5
    backoff_base_seconds: 2

scheduler:
  timezone: "America/New_York"
  eod_report: "16:15"     # after the close
  intraday_poll_seconds: 60
  # How often the intraday loop runs a fresh scan + profit-take check during RTH.
  intraday_loop_minutes: 15
  # Close a short option position when this fraction of max profit has been captured.
  profit_take_pct: 50
  # No new-entry scans after this ET time — profit-take checks still run until close.
  # 16:00 == RTH close, so this no longer trims anything off the trading day: the last
  # 15-min cycle (15:45) is now the last one, same as `is_rth` would allow anyway. That
  # also means new entries can now be surfaced in the closing minutes (last-hour gamma
  # risk + wide spreads) that a tighter cutoff used to keep out — a deliberate choice
  # (2026-09-11), not an oversight.
  entry_cutoff: "16:00"
  # Hard ceiling (minutes) on a single EOD run (scripts.run_eod), enforced by the
  # scripts.start supervisor loop. A run still alive past this is SIGTERMed, then SIGKILLed
  # after STOP_GRACE_SECONDS — see scripts/start.py's EOD scheduler docstring.
  eod_timeout_minutes: 60

market_data:
  # Stay under the retail concurrent-line limit (~100). Chains are requested in
  # batches of this many option contracts, then cancelled before the next batch.
  max_concurrent_lines: 90
  chain_batch_size: 40
  request_throttle_seconds: 0.25   # pacing guard between requests
  quote_sleep_seconds: 2.0         # wait after reqMktData(snapshot=True) for tick to arrive
  # Strike band (N6): scan strikes within ±band of spot, where
  #   band = max(strike_band_pct, strike_band_iv_mult · IV · √(DTE/365))
  # so high-IV names widen enough to include the ~0.25-delta strike. Per-symbol overrides
  # live in universe.yaml under `strike_bands:`.
  strike_band_pct: 0.15            # floor / fallback when a symbol has no stored IV
  strike_band_iv_mult: 1.5
  # Cap on in-band strikes kept per symbol. A high-IV name at a wide band with dense ($2.50)
  # spacing can yield 120+ strikes; the full cartesian (strikes × expirations × 2) then becomes
  # a several-hundred-contract qualifyContractsAsync burst that floods IBKR with reqContractDetails
  # for non-existent weekly strikes and trips a session-wedging pacing lockout (this hung the
  # 2026-06-22 scan on SMH at 768 contracts). Keep the N strikes nearest spot. 0 disables.
  max_strikes_per_symbol: 80
  # Per-chunk timeout for chunked contract qualification. Qualification is paced in
  # chain_batch_size chunks; a chunk that never resolves returns partial results instead of
  # hanging the whole symbol and being killed mid-flight by symbol_timeout (that cancellation
  # is what wedged the ib_async session on 2026-06-22).
  qualify_timeout_seconds: 20
  # Max time to spend fetching one symbol's option chain during /scan. If IBKR never
  # responds (pacing violation, competing-session lockout), the symbol is skipped and the
  # scan moves on instead of hanging indefinitely. SPY/QQQ have large chains where all
  # strikes qualify, pushing past 90s; 150s accommodates them without hanging forever.
  symbol_timeout_seconds: 150
  # Bounds the reqHistoricalData fallback in _get_spot/_get_spot_async, only reached when
  # the snapshot has neither a live tick nor a previous close. ib_async's default is 60s —
  # on a weekend/no-subscription session that was ~60s x every symbol, the dominant cost
  # of /scan.
  spot_history_timeout_seconds: 10
  # Half-dead-socket guards. When TWS loses its upstream link to IBKR (Error 1100), the
  # exec-socket handshake stays up so ib.isConnected() returns True and account summary still
  # resolves, but every data-farm request silently never ticks. A scan that trusts
  # isConnected() then times out on EVERY symbol at symbol_timeout_seconds (~115 min for 46
  # symbols), monopolising the single intraday loop so every later 15-min cycle is starved
  # (this is what killed the 2026-06-24 02:00 SGT scan and blocked the ones after it).
  # health_probe_*: before each intraday scan, one snapshot quote on this symbol must return
  #   within the timeout; if not, the cycle is skipped and a forced reconnect is triggered.
  # max_consecutive_chain_timeouts: mid-scan circuit breaker — this many back-to-back symbol
  #   timeouts aborts the run instead of grinding the rest of the universe. 0 disables it.
  health_probe_symbol: "SPY"
  health_probe_timeout_seconds: 15
  max_consecutive_chain_timeouts: 3
  # S1 safety net: force a full option-chain fetch for a symbol once it hasn't been refreshed in
  # this many minutes. 0 disables it. Checked PER SYMBOL (2026-08-27), not "sweep the whole core
  # together the moment the single stalest one crosses the line" — that old rule let one quiet
  # name drag every actively_wheeling name into a synchronized burst each time its clock
  # expired. Per-symbol staleness spreads refreshes out over time naturally, since names that
  # move often (and so already refetch via the move gate below) and names that stay quiet
  # desynchronize on their own — no explicit batch/rotation schedule needed. A full sweep of
  # everything still costs 15-25 min at current per-symbol qualify cost (2026-08-21) if it ever
  # does happen all at once (cold start, or force_full_sweep on the first cycle after a
  # restart) — was 90, raised to 120 for the same reason. Each fetched symbol carries its OWN
  # fetch timestamp (2026-08-28) instead of one run-level stamp, so a sweep's cohort expires
  # spread across the span the sweep itself took rather than all inside one later cycle — which
  # matters because a burst longer than `scheduler.intraday_loop_minutes` overruns the cycle and
  # costs the next one entirely. The intraday loop separately forces
  # one full sweep unconditionally on its first eligible cycle after every process start,
  # regardless of this timer (see `_intraday_scan_loop`'s `startup_full_sweep_done` bot_data
  # flag). Only scoped to `actively_wheeling` ∪ held names — dip-watch names below are excluded.
  force_full_scan_minutes: 120
  # Held stock positions used to be fetched unconditionally every intraday cycle — the single
  # biggest fixed IBKR chain-fetch cost, since it ignored movement entirely. Now gated, and
  # directional (2026-08-27, up only): refetched only once the live spot has *risen* >= this
  # fraction from its last-fetch baseline — a new CC candidate needs room to sell an OTM strike,
  # which only a rally creates; existing-position risk is handled continuously by the separate
  # event-driven monitor, not this gate. A drop is still caught by force_full_scan_minutes above.
  # UNIONed, not overriding (2026-08-28): a held name that is also actively_wheeling or would_own
  # keeps that bucket's rule and merely *gains* this rally trigger, so holding shares can never
  # reduce how often a name is scanned. Up-only is the whole story only for a held name that is
  # in no other bucket.
  held_position_move_pct: 0.02
  # would_own names outside universe.yaml's `actively_wheeling` are opportunistic, not part of
  # the core rotation — they're pulled into a scan cycle only when the live spot has *dropped*
  # at least this fraction from its last-fetch baseline (a rally is never a CSP entry signal).
  # Never subject to force_full_scan_minutes. Applies whether or not the name is also held.
  # At startup / manual /scan, the same threshold is checked bidirectionally against the
  # persisted baseline — a gap (up or down) ≥3% is a legitimate CSP setup at the open; a quiet
  # overnight name gets seed-only (yfinance baseline persisted, no chain fetch) — 2026-08-28.
  dip_pull_in_pct: 0.03
  # Per-cycle wall-clock ceiling on option-chain fetching in the 15-min intraday loop
  # (2026-08-28). 0 disables. The materiality gate keeps a normal cycle tiny — measured over 125
  # real cycles: median 1 material symbol, mean 3.8 — but its filtering collapses when
  # correlation goes to 1. A broad -3% day makes every would_own name material at once, and at a
  # measured ~37s mean per fetch (n=385: p50 35s, p75 46s, p90 58s) that is a ~28-min sweep
  # inside a 15-min cycle. 5 of 66 real runs already overran, up to 30.1 min — and an overrun
  # sets `scan_running`, so the NEXT cycle's scan is skipped entirely (profit-take and loss-exit
  # checks still run; they precede the scan). Symbols cut by the budget are carried to
  # `ScanResult.unreached_symbols` -> next cycle's `must_include_symbols`, where they rank first,
  # so a cluster drains over consecutive on-time cycles instead of one burst that eats the next.
  # Sizing, from a least-squares fit over 19 real full-universe cycles in this deployment:
  #     scan duration = 56s + 29.9s x (material symbols)
  # The 56s intercept is fixed per-cycle work (analytics + sentiment run for EVERY symbol,
  # material or not, because they feed the buy-to-own screen and the Claude prompt; plus VIX,
  # account, scoring, review, Telegram). So: 900s cycle - 56s overhead - 150s
  # (`symbol_timeout_seconds`) of overshoot headroom, since the budget can only be checked
  # between symbols and a fetch in flight can't be preempted => 694s, rounded DOWN to 600s
  # (~20 fetches). 600 is the largest round value that still cannot overrun: 600 + 150 + 56 =
  # 806s < 900s even if the final symbol starts one tick under the deadline and then times out.
  # Coupled to `scheduler.intraday_loop_minutes` - do not change one without the other. Note the
  # coupling is counter-intuitive: SHORTENING the cycle *lowers* hourly fetch throughput, because
  # the 56s overhead and the 150s margin are both paid per cycle regardless of its length (206s
  # of every cycle is fixed = 23% at 15 min, 34% at 10 min, 69% at 5 min).
  chain_fetch_budget_seconds: 600

  # Minimum minutes between automatic portfolio snapshots written by the intraday
  # monitor. A `refresh` command ignores this — an operator asking for a fetch
  # gets one. P3-P4 M1; see Web plan/P3-P4-design.md §4.
  portfolio_snapshot_interval_minutes: 15

claude:
  cli_command: "claude"
  timeout_seconds: 180
  max_retries: 1
  output_format: "json"
  # If false, the pipeline ships the deterministic Rules-Engine list without
  # Claude enrichment (used when the CLI is unavailable).
  enabled: true
  # N3 — headless-subprocess hardening. The CLI runs unattended ~26+×/day; constrain it so a
  # runaway/injection can't drive tools or the filesystem. The fence already isolates Claude's
  # output from execution; this isolates the subprocess itself.
  max_turns: 1                      # single agentic turn — no tool loops (0 disables the flag)
  model: "claude-sonnet-4-6"        # pin the enrichment model (reproducible + cost-bounded)
  disallowed_tools: "Bash Edit Write Read Glob Grep WebFetch WebSearch NotebookEdit Task"
  # Local-LLM (Ollama) backend. "cli" (default) | "ollama" | "cli_then_ollama" (try claude -p,
  # fall back to the local model on CLI failure/timeout/unparseable output). Requires
  # `ollama serve` running locally with `ollama_model` pulled — see SETUP.md.
  backend: "ollama"
  ollama_host: "http://localhost:11434"
  # qwen3:8b (~5GB) — the active model: comfortable memory headroom on an 18GB Mac alongside
  # TWS/Gateway; ollama_runner disables its "thinking" mode (think=false) so format=json output
  # stays clean and fast.
  # Upgrade: "qwen3:14b" (~9GB, Q4_K_M) — more reasoning depth if you have the RAM (needs ~16-18GB
  # free), at the cost of headroom alongside TWS.
  # Alternative: "phi4:14b" — similar ~9GB footprint, strong structured-output/instruction
  # following, and (being a non-hybrid-reasoning model) has no thinking-mode/JSON interaction
  # to worry about — a simpler/more predictable choice if qwen3's output proves flaky.
  ollama_model: "qwen3:8b"
  ollama_timeout_seconds: 120
  # Context window (tokens). Must cover the whole prompt PLUS the generated JSON or Ollama
  # silently truncates one or both → dropped reviews. A worst-case full scan measures ~6.3k
  # input tokens + ~2k output; 16384 leaves headroom. Lower to 8192 if qwen3:8b OOMs on 18GB.
  ollama_num_ctx: 16384
  # Keep the model resident between a scan's successive calls so each one doesn't pay a reload.
  ollama_keep_alive: "10m"
  # Sampling temperature — low keeps the JSON disciplined; raise only to experiment.
  ollama_temperature: 0.2

storage:
  # SQLAlchemy URL. SQLite for v1; swap for postgresql://... later.
  db_url: "sqlite:///data/income_system.db"
  iv_history_parquet: "data/iv_history.parquet"
  # Days of intraday portfolio history kept. Pruned by the EOD run. See
  # Web plan/P3-P4-design.md §4.2: a year of intraday history needs a rollup,
  # not a longer retention here. P3-P4 M1.
  portfolio_snapshot_retention_days: 30

logging:
  level: "INFO"
  file: "logs/system.log"

approval:
  # Approvals older than this are marked EXPIRED and never sent to the broker.
  ttl_minutes: 60

execution:
  # If true, QUEUED orders wait for Regular Trading Hours before transmitting.
  transmit_only_in_rth: true
  # Cancel unfilled orders after this many minutes.
  fill_timeout_minutes: 5
  # Seconds between each QUEUED-order poll cycle in the approval_service.
  poll_interval_seconds: 30
  # Seconds to wait for a live bid/ask tick before giving up on the pre-execution quote.
  quote_timeout_seconds: 10.0
  # --- Limit-order repricing (chase logic) ---
  # When an order has not filled, step its limit toward the far quote side to chase a fill
  # instead of only waiting out fill_timeout_minutes then cancelling. A SELL chases down toward
  # the bid (never below min_live_premium_ratio × approved premium); reprices stop after
  # max_reprices, then the order cancels on timeout as before. Default OFF — unverified on a
  # live account (see STATUS.md "verify on a live paper session").
  reprice_enabled: false
  reprice_interval_seconds: 45.0   # wait between reprice steps
  max_reprices: 2                  # reprice steps before giving up
  reprice_step_pct: 0.34           # fraction of the remaining distance to the bid per step

automation:
  # Circuit breakers for AUTOMATED mode (the cumulative risk gate bounds exposure;
  # these bound activity + losses). The /halt Telegram command is a separate kill switch.
  # Max NEW-exposure entry orders opened per ET trading day (auto or manual). 0 disables.
  max_auto_trades_per_day: 10
  # Mark-to-market, not fill cashflow. See config.py AutomationCfg.
  daily_loss_halt_pct: 3.0
  drawdown_halt_pct: 10.0
  # Buy to close when cost-to-close reaches this multiple of the entry credit. 0 disables.
  max_loss_multiple: 2.0
  # Risk-reducing closes (profit takes AND loss exits) run independently of autonomy level.
  auto_close_enabled: true

# Backend selection for the src/data/ provider abstraction layer (Phase 2).
# Each key names the active backend for one of the three Protocols in src/data/protocols.py.
# Phase 2 ships only the "yfinance" backend; "fmp" is accepted (the stub exists in
# src/data/fmp_backend.py) but raises NotImplementedError on use — the swap path is
# documented but not wired. Swap a value to switch that provider's backend.
data:
  price_provider: yfinance
  fundamentals_provider: yfinance
  news_provider: yfinance
  symbol_directory_provider: edgar
  filings_provider: edgar
  # stooq is not usable: see docs/web/data-sources.md (licence check, 2026-09-04) — the CSV
  # endpoint now sits behind a JS bot-verification challenge. yfinance is the only backend.
  bulk_price_provider: yfinance

monitor:
  # Short option delta drift: roll if |delta| exceeds this ceiling.
  delta_ceiling: 0.45
  # Roll if DTE drops to this threshold or below.
  dte_threshold: 7
  # Roll if IV has risen more than this percentage above the entry IV.
  iv_spike_pct: 40
  # Warn if ex-dividend date is within this many days for a short call.
  ex_div_days_ahead: 5
  # Suppress re-alerts for the same (position, trigger) within this window.
  alert_cooldown_minutes: 30
  # N20: when true, a roll trigger sends an approvable roll candidate (Approve → QUEUED ROLL →
  # execute_roll) instead of an alert-only message. Default false until the BAG combo sign
  # convention is verified on a live paper account.
  roll_execution_enabled: false
  # C4: assignment-risk alert — fires when |delta| >= threshold AND DTE <= dte window.
  # Targets deep-ITM shorts near expiry; suggests roll / close / let-assign.
  assignment_alert_delta: 0.70
  assignment_alert_dte: 21
  # Mechanical management point. Entries are 21-45 DTE; dte_threshold (7) is deep into gamma.
  manage_at_dte: 21
  # Defensive rolls are judged on risk reduction, not yield — requiring 1% ROC from a roll
  # meant the candidate list was empty exactly when the monitor fired.
  roll_defensive:
    max_debit: 0.50
    min_delta_reduction: 0.10
    require_breakeven_improvement: true
