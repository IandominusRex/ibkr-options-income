# Connection, scheduling, and process-level settings.
# Secrets live in .env, NOT here.

ibkr:
  host: "127.0.0.1"
  # Paper TWS: 7497 | Live TWS: 7496 | Paper Gateway: 4002 | Live Gateway: 4001
  paper_port: 7497
  live_port: 7496
  # One clientId per process to avoid conflicts. The trading_skills MCP and the
  # dashboard must each use a DIFFERENT id from these.
  client_ids:
    engine: 11        # orchestrator / morning scan
    monitor: 12       # intraday event loop
    backfill: 13      # historical IV backfill script
    exec: 14          # execution engine order-placement (approval_service daemon)
    scan: 15          # market data fetch during /scan command (approval_service daemon)
    healthcheck: 19
    # trading_skills MCP should be configured with clientId 20 (see .mcp.json)
    # dashboard should use clientId 21
  # 1 = real-time, 2 = frozen, 3 = delayed, 4 = delayed-frozen.
  # You have real-time OPRA data, so 1. Falls back to 3 automatically if a line
  # has no subscription.
  market_data_type: 1
  connect_timeout_seconds: 15
  reconnect:
    max_retries: 5
    backoff_base_seconds: 2

scheduler:
  timezone: "America/New_York"
  morning_scan: "09:45"   # after the open settles
  eod_report: "16:15"     # after the close
  intraday_poll_seconds: 60
  # How often the intraday loop runs a fresh scan + profit-take check during RTH.
  intraday_loop_minutes: 15
  # Close a short option position when this fraction of max profit has been captured.
  profit_take_pct: 50
  # No new-entry scans after this ET time — profit-take checks still run until close.
  entry_cutoff: "15:00"

market_data:
  # Stay under the retail concurrent-line limit (~100). Chains are requested in
  # batches of this many option contracts, then cancelled before the next batch.
  max_concurrent_lines: 90
  chain_batch_size: 40
  request_throttle_seconds: 0.25   # pacing guard between requests
  quote_sleep_seconds: 2.0         # wait after reqMktData(snapshot=True) for tick to arrive

claude:
  cli_command: "claude"
  timeout_seconds: 180
  max_retries: 1
  output_format: "json"
  # If false, the pipeline ships the deterministic Rules-Engine list without
  # Claude enrichment (used when the CLI is unavailable).
  enabled: true

storage:
  # SQLAlchemy URL. SQLite for v1; swap for postgresql://... later.
  db_url: "sqlite:///data/income_system.db"
  iv_history_parquet: "data/iv_history.parquet"

logging:
  level: "INFO"
  file: "logs/system.log"

approval:
  # Approvals older than this are marked EXPIRED and never sent to the broker.
  ttl_minutes: 60

execution:
  # If true, QUEUED orders wait for Regular Trading Hours before transmitting.
  transmit_only_in_rth: true
  # Cancel unfilled orders after this many minutes.
  fill_timeout_minutes: 5
  # Seconds between each QUEUED-order poll cycle in the approval_service.
  poll_interval_seconds: 30
  # Seconds to wait for a live bid/ask tick before giving up on the pre-execution quote.
  quote_timeout_seconds: 10.0

monitor:
  # Short option delta drift: roll if |delta| exceeds this ceiling.
  delta_ceiling: 0.45
  # Roll if DTE drops to this threshold or below.
  dte_threshold: 7
  # Roll if IV has risen more than this percentage above the entry IV.
  iv_spike_pct: 40
  # Warn if ex-dividend date is within this many days for a short call.
  ex_div_days_ahead: 5
  # Suppress re-alerts for the same (position, trigger) within this window.
  alert_cooldown_minutes: 30
