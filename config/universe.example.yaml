# The scan universe, the CSP "would-own" allowlist, and the "actively wheeling" core.
#
# Three concepts, not one:
#   `indexes` / `watchlist` — the full documented universe (CC candidates when held; daily
#       IV-history/price bookkeeping). Scanned lightly (analytics only) every intraday cycle,
#       but NOT option-chain-fetched unless also in `would_own` and material this cycle.
#   `would_own` — stocks/ETFs you are genuinely comfortable being assigned (owning long term).
#       CSP candidates are filtered to this set — the system will ONLY recommend cash-secured
#       puts on names in `would_own`. Keep it honest.
#   `actively_wheeling` — a SUBSET of `would_own`: the core names you're actively running the
#       wheel on. These get the full per-cycle materiality treatment (0.5% move gate, 120-min
#       forced sweep — see `market_data.intraday_rescan_move_pct` / `force_full_scan_minutes`).
#       Everything in `would_own` but NOT in `actively_wheeling` is "dip-watch": not scanned
#       every cycle at all, only pulled into that cycle's option-chain scan when its live spot
#       has *dropped* ≥ `market_data.dip_pull_in_pct` (3%) since its last fetch — a rally is
#       never a CSP entry signal, so this check is directional, unlike the 0.5% gate above.
#       Dip-watch names are also excluded from the 120-min forced sweep (event-triggered only,
#       and the 120-min sweep is per symbol, not "the whole core at once" — see settings.yaml).
#   Currently-held stock positions are eligible for a CC-candidate refresh regardless of which
#   (if any) of the lists above they're in, gated at `market_data.held_position_move_pct` (2%,
#   UP only — a new CC strike needs room a rally creates, not a drop; existing-position risk is
#   handled by the separate event-driven monitor) instead of unconditionally every cycle.
#   That held rule is ADDED to whichever list rule already applies, never substituted for it
#   (2026-08-28): a name you hold *and* actively wheel keeps its 0.5% either-way gate and gains
#   the 2% rally trigger; a held dip-watch name keeps its 3% dip trigger and gains the same.
#   Holding shares never narrows coverage — the CSP screen runs for every would_own symbol
#   whether or not it is held, so a held wheel name has a live CSP reason to refetch on a dip
#   that the CC-oriented held rule alone cannot see.
#
# Risk tiers (for reference — organizational only, all tiers scan for CCs):
#   safe_bets — core income: liquid, stable, fund-manager grade (SPY/QQQ/GOOGL/NVDA/JPM)
#   moderate  — active income: elevated IV, real fundamentals (META/PLTR/HOOD/SOFI/HIMS)
#   risky     — speculative / high-IV: premium income only, assignment is a risk event
#             Leveraged ETFs (LABU/TSLL) — CC-only, NEVER in would_own (daily-reset decay)
#             TQQQ/UPRO/SOXL/DPST — leveraged, but a DELIBERATE would_own exception (TQQQ/UPRO/SOXL
#             confirmed 2026-08-27; DPST confirmed 2026-09-29: decay risk on assignment is
#             accepted for these four specifically)
#             Individual speculative names (MARA/RGTI/ASTS/RKLB) — CSP only, hard position limits
#
# Archived tickers (things you've decided you'll never trade) live in
# `config/universe_archive.yaml` — reference-only, never loaded by the application.
#
# Symbol rule: one ticker string feeds BOTH yfinance and IBKR, so only names with a single
# clean symbol belong here. Class shares like Berkshire-B (yfinance "BRK-B" vs IBKR "BRK B")
# do not resolve on both and are intentionally excluded.

# ── ETFs ──────────────────────────────────────────────────────────────────────

# safe_bets — core ETF backbone
indexes:
  # SPY is reserved for the daily credit-spread book (config/spreads.example.yaml → book_underlyings)
  - QQQ          # Nasdaq-100; slightly higher IV than SPY
  - IWM          # Russell 2000; better premiums, higher vol
  - SMH          # Semiconductor sector proxy; good OI
  - MAGS         # Roundhill Magnificent Seven ETF; equal-weight AAPL/MSFT/GOOGL/AMZN/META/NVDA/TSLA
                 # NOTE: heavily overlaps GOOGL/NVDA/AMZN below — same tech-sector bucket

  # safe_bets — sector / diversifier ETFs (broaden away from the tech/growth/crypto tilt)
  - XLV          # Healthcare sector; defensive — LOW IV, thin premium; would_own-eligible but
                 # rarely worth chasing for CSP (dip-watch only, not actively_wheeling)
  - XLP          # Consumer staples; very low IV — often below min_iv_rank; dip-watch only
  - TLT          # Long-duration Treasuries; very low IV — hedge sleeve, rarely signals; dip-watch only

  # moderate — sector/thematic ETFs
  - HACK         # Cybersecurity ETF
  - IGV          # Software ETF

  # risky — leveraged, DELIBERATE would_own exception (TQQQ/UPRO/SOXL confirmed 2026-08-27;
  # DPST confirmed 2026-09-29)
  - TQQQ         # 3× Nasdaq-100; daily-reset decay accepted for CSP/CC
  - UPRO         # 3× S&P 500; daily-reset decay accepted for CSP/CC
  - SOXL         # 3× Semiconductor; annualized CC yields 180–530%; daily-reset decay accepted
  - DPST         # 3× Regional Banks; interest-rate sensitive; good CC premiums; would_own
                 # exception (2026-09-29) — assignment means holding a daily-reset product

  # risky — CC-only leveraged ETFs; NEVER add to would_own
  - LABU         # 3× Biotech; binary FDA gap risk on top of leverage decay
  - TSLL         # 2× TSLA; affordable entry; high IV

# ── Individual stocks ─────────────────────────────────────────────────────────

watchlist:
  # safe_bets — mega-cap, fund-manager grade
  - NVDA         # AI leader; IV 40–65; highest-premium safe-bet name; actively_wheeling
  - AAPL         # Most liquid single-stock options; IV 22–35; dip-watch only
  - MSFT         # Solid fundamentals; consistent premium; IV 22–32; dip-watch only
  - GOOGL        # Liquid chains; search + AI moat; IV 25–38; actively_wheeling
  - AMZN         # Strong FCF; ~$205/sh; IV 28–42; actively_wheeling
  - JPM          # Best-in-class bank; financials diversifier; IV 22–35; dip-watch only
  - V            # Visa; payments network moat; liquid options; lower IV (~20–28); dip-watch only
  - WMT          # Walmart; defensive consumer staple; ~$120/sh; liquid options; dip-watch only
  - AMD          # Held (300 sh); semis; liquid chains; CC-eligible while held; dip-watch only if added to would_own
  - BAC          # Held (1000 sh); money-centre bank; liquid chains; CC-eligible while held

  # moderate — elevated IV, real fundamentals, assignment acceptable
  - TSLA         # Top single-stock income name; deepest liquidity after AAPL; IV 40–70; dip-watch only
  - META         # Exceptional premiums since 2023 recovery; IV 30–50; actively_wheeling
  - PLTR         # AI/defense; real revenue; IV rank ~47; ~$158/sh; actively_wheeling
  - SOFI         # Fintech turnaround; up 32% in 2026; ~$18/sh; IV 55–80; actively_wheeling
  - HOOD         # Retail brokerage; active options; ~$90/sh; IV 50–80; actively_wheeling
  - HIMS         # Telehealth growth; ±16% implied earnings move; IV 60–90; actively_wheeling
  - BABA         # Alibaba ADR; IV 40–55; NOTE: ADR delisting risk — size conservatively; dip-watch only
  - NBIS         # Nebius Group; AI infrastructure/cloud; elevated IV; actively_wheeling
  - UBER         # Mobility + delivery platform; liquid options; dip-watch only
  - CRWD         # CrowdStrike; cybersecurity leader; dip-watch only
  - TEM          # Tempus AI; healthcare AI platform; CC-only (not in would_own)

  # risky — speculative / high-IV; position size controlled by risk engine limits
  - MARA         # Bitcoin miner proxy; IV 90–130; BTC correlation = gap risk; actively_wheeling
  - RGTI         # Quantum computing; speculative; IV mean ~86; early stage; actively_wheeling
  - RKLB         # Rocket Lab; space launch and satellite systems; actively_wheeling
  - ASTS         # AST SpaceMobile; satellite communications; actively_wheeling
  - IONQ         # Quantum computing; CC-only (not in would_own)

