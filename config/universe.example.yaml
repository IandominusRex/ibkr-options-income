# ---------------------------------------------------------------------------
# Per-symbol strike-band overrides (N6). Optional. The chain scanner picks strikes
# within ±band of spot; by default band scales with the symbol's stored IV
# (settings.yaml → market_data.strike_band_*). These overrides win (clamped to the floor),
# guaranteeing the ~0.25-delta strike is in scope for extreme-IV leveraged ETFs even before
# their iv_history is backfilled. Express as a fraction (0.45 = ±45%).
# ---------------------------------------------------------------------------
strike_bands:
  SOXL: 0.45
  LABU: 0.50
  TSLL: 0.45
  DPST: 0.40
  TQQQ: 0.45
  UPRO: 0.45
  MARA: 0.45
  RGTI: 0.45
  IONQ: 0.45
  ASTS: 0.45

# ---------------------------------------------------------------------------
# Leveraged ETFs (2026-08-27; DPST moved into the exception set 2026-09-29).
# Listed here once so the research checks layer (src/research/checks/warnings.py)
# can surface the daily-reset decay warning without keeping a second hard-coded
# copy. Membership rules, derived:
#   • CC-only (never assignment-eligible) = leveraged_etfs − would_own
#       → LABU / TSLL
#   • Deliberate would_own exception       = leveraged_etfs ∩ would_own
#       → TQQQ / UPRO / SOXL / DPST (TQQQ/UPRO/SOXL confirmed 2026-08-27; DPST
#         confirmed 2026-09-29)
# Do not move a name between the two sets by editing here alone — the would_own
# list is the source of truth for which side of the line a name sits on.
# ---------------------------------------------------------------------------
leveraged_etfs:
  - TQQQ
  - UPRO
  - SOXL
  - DPST
  - LABU
  - TSLL
