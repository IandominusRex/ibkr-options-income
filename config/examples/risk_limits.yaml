# Deterministic hard limits enforced by the Rules Engine (engine/risk_engine.py).
# These are the circuit breaker between a recommendation and the broker.
# Conservative theta-gang defaults — tune freely; no code change required.

# --- Strike / delta targeting (per strategy) ---
covered_call:
  delta_min: 0.20
  delta_max: 0.35
  dte_min: 7
  dte_max: 28
  # Reject if the call strike is below this fraction of cost basis (N18, deliberate policy):
  # at 1.00 an underwater holding generates NO covered calls (writing below basis would lock in
  # a loss on assignment). Lower it (e.g. 0.95) to allow below-basis writes and keep harvesting
  # premium on a long-term hold at the cost of capping its recovery.
  min_strike_vs_basis: 1.00

cash_secured_put:
  delta_min: 0.20
  delta_max: 0.35
  dte_min: 7
  dte_max: 28
  # Hard cap on contracts per single CSP candidate (prevents a single trade from
  # consuming the full CSP budget). The cumulative risk gate enforces the overall cap.
  max_contracts: 10

# --- Income quality gates ---
income:
  # PRIMARY GATE: require the credit to exceed Black-Scholes fair value priced at *realised*
  # vol (HV30) by `ideal_zone.min_credit_edge_pct`. This is the variance-risk-premium thesis
  # made explicit — selling at or below fair value earns no edge for the risk taken.
  require_vrp_edge: true
  # Noise floor only. These were previously the primary gate, and max(1.0%, 12% x DTE/365)
  # acted as a hidden ~25-30% IV floor: SPY at 13.5% IV yields 0.33% ROC at 0.20 delta and
  # 0.66% at 0.30, so every low-vol diversifier in universe.yaml was unreachable, and the
  # gate pushed every trade to the aggressive end of the configured delta band.
  min_roc_pct: 0.15
  min_annualized_yield_pct: 0.0

# --- Liquidity gates ---
liquidity:
  max_bid_ask_spread_pct: 10.0   # of mid
  min_open_interest: 100
  min_option_volume: 10
  # N19: the day's option volume often hasn't printed yet at a 9:45 ET scan, so the volume gate
  # would wrongly reject liquid chains early in the session. Before this ET time, the volume gate
  # is skipped and OI + spread (both stable from the open) carry the liquidity check.
  morning_volume_cutoff_et: "10:30"

# --- IV environment ---
iv:
  # Only sell premium when it's relatively expensive.
  min_iv_rank: 30
  # IV/RV richness gate (C1): sell only when implied vol exceeds realized vol by this ratio.
  # Missing ratio is treated as "data unavailable" and never blocks the scan.
  min_iv_rv_ratio: 1.05
  # Lookback window (trading days) for the realized-vol computation used in the IV/RV ratio.
  realized_vol_window: 20

# --- Ideal-price zone (analytics/fair_value.py) ---
# TWO KINDS OF KNOB IN THIS BLOCK — do not assume it is all inert.
#   * The strike-band and action-level knobs (em_lo_mult_call, em_lo_mult_put, em_hi_mult,
#     earnings_widen_mult, support_pull_pct, buy_margin_of_safety_pct) are DISPLAY + OPTIONAL
#     RANKING ONLY: they
#     shape the "ideal strike / action level" shown on every card and injected into the
#     reasoning prompt, and feed scoring only through scoring_weights.yaml's `zone_fit`,
#     which ships at 0.0 (off).
#   * `min_credit_edge_pct` DOES reject candidates. Since D2 it sets IdealZone.min_credit,
#     which risk_engine.validate_candidates compares the offered premium against under
#     `income.require_vrp_edge` (ships true) — reason `premium_below_fair_value`. Raising it
#     tightens a live gate, not a display number.
# fair_value.py itself still has no reject path of its own; it computes and returns numbers,
# and the Rules Engine (risk_engine.py) remains the sole path to an order.
ideal_zone:
  # The strike band, expressed in expected moves (1σ = spot · IV · √(DTE/365)).
  # Calibrated against the delta bands the generators actually screen — NOT picked by feel.
  # Measured with Black-Scholes across this universe's spot/IV/DTE range. Both CC and CSP
  # screen 0.20–0.35|Δ|, but puts and calls do NOT map to the same sigma distance at equal
  # delta: a 0.20–0.35 delta call sits at ~0.48–1.17σ, while a 0.20–0.35 delta put runs from
  # ~0.21σ (high-vol/longer-DTE names, e.g. 90% IV/40 DTE, at the 0.35-delta end) to ~0.74σ.
  # That is why the inner edge is split per right below instead of one shared value: a single
  # floor low enough to admit the widened put range (down to 0.18, with ~0.03σ margin under
  # the 0.21σ worst case) also drags the CALL inner edge close enough to spot to let a
  # ~0.46-delta covered call register "in zone" — the exact bug this floor exists to prevent
  # (`tests/test_output_fidelity.py::test_ideal_call_band_never_endorses_an_at_the_money_write`).
  # `em_hi_mult` (the outer edge) stays shared — 1.20 comfortably brackets both rights' outer
  # bound (call ~1.17σ, put ≤0.74σ) with margin, and the historical bug was inner-edge-only.
  # Get this wrong and the feature becomes noise: a band placed outside the range actually
  # traded reports every real candidate as "outside the ideal zone".
  # The band is the *acceptable* range; the specificity lives in `strike_anchor`, which the
  # support/resistance snap and the SMA anchor pull to a particular level inside it.
  em_lo_mult_call: 0.30    # inner edge (closer to spot), covered calls
  em_lo_mult_put: 0.18     # inner edge (closer to spot), cash-secured puts
  em_hi_mult: 1.20    # outer edge (further OTM)
  # Extra cushion pushed outward when earnings fall inside the option's life.
  earnings_widen_mult: 0.25
  # Snap the band to a support/resistance level when one sits within this % of an edge.
  support_pull_pct: 3.0
  # Required premium over Black-Scholes fair value priced at *realised* vol (HV30). This is
  # the variance-risk-premium thesis made explicit: selling at or below fair value earns no
  # edge for the risk taken. Raise to demand a richer entry.
  min_credit_edge_pct: 10.0
  # Discount applied to the analyst mean target when placing the share-acquisition level.
  buy_margin_of_safety_pct: 8.0

# --- Live execution re-gate (send-time, validate_live_quote) ---
live_execution:
  # Reject a fill when the live mid has collapsed below this fraction of the approved
  # premium (e.g. an intraday IV crush between approval and execution). 0.80 allows up to
  # a 20% drop before refusing. Set to 0 (or null) to disable. (SYSTEM_REVIEW F2)
  min_live_premium_ratio: 0.80
  # In LIVE mode, require IBKR-sourced live greeks (delta present, greeks_source == "ibkr")
  # for the income delta gate — never fill a live trade vetted only by the delayed
  # Black-Scholes/yfinance fallback used for paper accounts. (SYSTEM_REVIEW F6)
  require_ibkr_greeks_when_live: true

# --- Event blackouts ---
events:
  earnings_blackout_days: 14     # no new short premium within N days of earnings
  ex_dividend_assignment_guard: true   # master switch: roll policy ex-dividend trigger (settings.yaml roll.ex_div)

# --- Portfolio: three constraints, each in its proper unit ---
# `max_pct_per_ticker` used to answer three unrelated questions at once, which is why any
# CSP above a ~$150 strike was unreachable at $300k NLV. Split:
#   1. feasibility  -> cash
#   2. concentration -> RISK UNITS (collateral x IV x sqrt(DTE/365))
#   3. deliberateness -> an explicit, counted large-position slot
portfolio:
  # 1. Feasibility. The reserve comes off FIRST; the CSP budget is a % of what remains.
  #    Order is fixed in code (engine/capital.resolve_caps) so the two can't contradict.
  cash_reserve_pct: 20.0
  cash_reserve_absolute: 10000
  max_csp_allocation_pct_of_deployable: 100.0

  # 2. Concentration, in risk units. CALIBRATION WARNING: these values are NOT comparable to
  #    the old collateral-based percentages. Risk units are collateral scaled by
  #    IV x sqrt(DTE/365) (typically 0.05-0.30), so 5.0 here is far more permissive than 5.0
  #    was before. Re-derive with `python -m scripts.capacity_report` before trusting them.
  max_risk_units_per_ticker_pct: 5.0
  max_risk_units_per_sector_pct: 25.0
  # Fallback cap used when IV is unavailable (strictly more conservative than risk units).
  max_collateral_per_ticker_pct: 10.0

  # 3. Deliberateness. CUMULATIVE per-ticker collateral (what is already held in the name plus
  #    the new lot) above max_collateral_per_ticker_pct needs a free slot and must still sit
  #    under the hard ceiling. Without this, a high-priced name is either impossible or
  #    unbounded — one number cannot express a third option. Measured cumulatively, this pair
  #    is also the raw-collateral backstop on the paths that cannot seed the risk-unit tallies
  #    from live IV (the order-approval re-gate, the single-ticker deep-dive, the CSP sizer):
  #    whatever those paths know about a candidate's IV, one name can never exceed
  #    max_pct_per_ticker_large in raw collateral.
  # Raised 1 -> 2 (2026-09-23): up to two names may now be a deliberate oversized bet at once.
  # Each is still individually capped at max_pct_per_ticker_large — two slots means up to 50%
  # of net liq combined across both names, not a change to either one's own ceiling.
  max_large_positions: 2
  max_pct_per_ticker_large: 25.0

  max_margin_usage_pct: 50.0
  max_new_positions_per_run: 10

# --- Market regime (analytics/regime.py -> engine/regime_limits.py) ---
# A deterministic classification of SPY and QQQ (normal / cautious / stressed / crisis) that
# shrinks NEW cash-secured puts in a falling market. Covered calls, rolls, closes, profit-takes
# and loss exits are never limited by it. The operator's private copy needs this block added by
# hand; with it absent the shipped defaults below apply. `/regime off` (Telegram) suspends the
# limits until the next trading day; `enabled: false` switches them off outright.
regime:
  enabled: true
  # Names governed by the stricter of the SPY and QQQ regimes (every other name follows SPY).
  # An explicit list: the sector tags misclassify e.g. TSLL as consumer and MARA as crypto.
  tech_linked: [QQQ, TQQQ, SMH, SOXL, NVDA, AMD, AVGO, AAPL, MSFT, GOOGL, AMZN, META, PLTR, MAGS,
                HACK, IGV, CRWD, NBIS, IONQ, RGTI, BABA, TSLL, MARA]
  csp:
    budget_multiplier:  {normal: 1.0, cautious: 0.7, stressed: 0.4, crisis: 0.1}
    per_trade_fraction: {normal: 1.0, cautious: 0.6, stressed: 0.3, crisis: 0.1}
    max_new_per_day:    {normal: null, cautious: 6, stressed: 3, crisis: 1}
    # The guaranteed floor: new CSP lots per governing index per ET day that may exceed the
    # regime-SCALED budget (never the unscaled caps, the per-trade ceiling or the daily limit).
    # Without it a full book (collateral at 101% of deployable on 2026-10-20) turns every
    # non-normal regime into a complete stop until the puts expire. Governing index: QQQ for a
    # tech_linked name, SPY for every other.
    floor_new_per_day:  {normal: 0, cautious: 2, stressed: 1, crisis: 1}
  thresholds:
    vol_cautious: 22.0        # VIX close (both indices)
    vol_stressed: 28.0
    vol_crisis: 36.0
    vol_pct_cautious: 90.0    # 1-year percentile of the VIX (80 fired at a VIX of 20.0 after a calm year)
    vol_pct_min_vol: 20.0     # ...and only when the VIX close is at least this
    term_stressed: 1.00       # VIX/VIX3M at or above -> at least stressed (backwardation)
    term_crisis: 1.10
    slow_drawdown_pct: 10.0   # slow signals may add at most one notch
    slow_ret_1m_pct: -5.0
    ease_contango_days: 3     # contango closes needed before easing one notch
    min_days_in_regime: 2
    intraday:                 # one-way within the day; expires at the close
      SPY: {stressed: -2.0, crisis: -3.5}
      QQQ: {stressed: -2.5, crisis: -4.0}
      vix_stressed: 30.0
      vix_crisis: 40.0
  # The scale-in ladder: under it, a further CSP lot on a name is accepted only once its price
  # has fallen into a zone worked out from the name's own technicals (swing lows on daily
  # lows, ATR-14), below the price at its last lot (the "anchor"). It applies to a name when its
  # market regime is one of `regimes`, or a name-level trigger holds in ANY regime: the name has
  # fallen name_drawdown_atr ATRs from its recent high, a short put on it is at or near the
  # money, or it had a loss exit within anchor_survival_days. A first lot (no anchor) is free.
  # Never applies to closes, rolls or covered calls; `/regime off` lifts the zone, not the
  # same-day loss-exit block.
  ladder:
    regimes: [stressed, crisis]          # market regimes where the ladder applies to every held name
    min_gap_pct: {normal: 5.0, cautious: 5.0, stressed: 5.0, crisis: 7.0}
    min_gap_atr: 1.5                     # the gap below the last lot is the larger of this and min_gap_pct
    band_atr: 0.5                        # the zone is the support +- this x ATR
    broken_atr: 1.0                      # a close this many ATRs under a support breaks it
    anchor_survival_days: 5              # the anchor survives a profit-take / loss exit this long
    name_drawdown_atr: 2.5               # fall from the recent high, in ATRs, that fires the ladder
    name_drawdown_sessions: 10
    recovery_closes: 2                   # closes AFTER the anchor lot above sma20 and the last-broken support lift it
    near_money_atr: 0.5                  # a short put with spot <= strike + this x ATR fires the ladder
    loss_exit_same_day_block: true       # no new CSP on a name for the rest of the ET day of its loss exit
  # The bottoming signal: in a fast drop the system must not simply wait for the slow easing
  # rules, so each scan looks for a deterministic sign that a bottom is forming and loosens ONE
  # notch. Market level (per index, only while its regime is stressed or crisis): after a VIX
  # spike the live VIX is `off_peak_pct` under the peak, the VIX/VIX3M curve is back under 1 if it
  # inverted, and the index holds above the low of the selloff's lowest day; the regime eases one
  # notch at once, and a fresh breach of an intraday escalation threshold cancels it for the day.
  # Name level (a name under the ladder): the price is at a support the ladder would otherwise
  # make it wait past, its RSI-14 was oversold within `rsi_lookback` sessions and has turned up,
  # and the last close is above the prior day's high; one lot may then be sold at once, with a
  # delta of at most `signal_delta_max` and at most one such lot per name per
  # `signal_lot_every_sessions` sessions. Every other gate still applies, and a signal lot uses
  # the guaranteed floor when the scaled budget is full.
  bottoming:
    vix_spike_pct: 25.0          # the VIX rose at least this much from its window low to its peak
    spike_sessions: 10
    off_peak_pct: 15.0           # live VIX at least this far below the spike peak
    rsi_oversold: 30.0
    rsi_lookback: 5
    signal_delta_max: 0.25       # must be above cash_secured_put.delta_min (0.20): checked at load
    signal_lot_every_sessions: 3

# --- Leveraged-ETF size ceiling (engine/regime_limits.py) ---
# A smaller per-trade size for 2x and 3x leveraged ETFs in EVERY regime. The ceiling is
# floor(cash_secured_put.max_contracts x the regime's per_trade_fraction x the fraction below),
# at least one lot (zero only when the regime's own ceiling is zero). `calm` applies while the
# name's regime is normal and no ladder trigger holds on it; `stressed` otherwise. This is not a
# regime limit: `/regime off` and `regime.enabled: false` leave it on. Rolls are exempt. The
# `leverage` map is the operator's: a leveraged ETF in universe.yaml's `leveraged_etfs` that is
# missing here is treated as 3x (the strictest) with a warning. TSLL's factor is yours to confirm.
leveraged_sizing:
  enabled: true
  per_trade_fraction:
    calm:     {2: 0.8, 3: 0.6}
    stressed: {2: 0.5, 3: 0.3}
  leverage: {TQQQ: 3, UPRO: 3, SOXL: 3, DPST: 3, LABU: 3, TSLL: 2}

# --- Claude's size cut (engine/regime_limits.py claude_cut; applied in notify/sender.py) ---
# Claude may LOWER, never raise, the contract count of an auto-opened opening cash-secured put
# (never a covered call, a roll, a strike, a price or a close). A missing, malformed or
# out-of-range value, or one produced by the local Ollama model, means the deterministic size.
# Every override is recorded in `sizing_actions` (`python -m scripts.sizing_report`): read that
# record before switching `apply_live` on.
claude_cut:
  apply_in_paper: true       # paper: the cut is applied and every override recorded
  apply_live: false          # live: record-only until the operator has reviewed the record
  breaker_min: 4             # circuit breaker: at least this many auto CSPs cut to 0 today...
  breaker_pct: 50            # ...and more than this % of the day's reviewed auto CSPs -> further cuts today are recorded, not applied

# --- Covered-call timing (analytics/breakout.py; engine/regime_limits.py cc_timing_reasons) ---
# After an UPSIDE BREAKOUT on a held name -- a close that rose `jump_atr` x ATR-14 on `volume_mult`
# x its 20-day average volume and cleared the nearest resistance (or a `high_sessions` high) --
# covered calls on it must be pushed out for `lookback_sessions` sessions (or until a close fades
# `fade_atr` x ATR under the breakout close): strike at or above max(next resistance, price +
# `floor_atr` x ATR) and delta at most `delta_max`. It only pushes a strike out: it never skips a
# name, loosens a limit or sizes anything. Its own switch, NOT a regime limit: `/regime off` and
# `regime.enabled: false` leave it on. Rolls are exempt. `delta_max` must exceed
# covered_call.delta_min (checked at load, or the rule would stop every call, not push it out).
cc_timing:
  breakout:
    enabled: true
    lookback_sessions: 5      # a breakout governs CC strikes for this many sessions
    jump_atr: 1.5             # close-to-close rise, in ATR-14 of the day before
    volume_mult: 1.5          # the day's volume vs its 20-session average
    high_sessions: 60         # a close at this many sessions' high counts too
    fade_atr: 1.0             # a later close this many ATRs below the breakout close ends it
    floor_atr: 1.0            # strike floor = max(next resistance above price, price + floor_atr x ATR)
    delta_max: 0.25           # must exceed covered_call.delta_min (0.20), checked at load

# NOTE: approval TTL and transmit-only-in-RTH live in settings.yaml
# (approval.ttl_minutes / execution.transmit_only_in_rth) — NOT here. A duplicate
# `approval:` block used to sit in this file but was never read by the config loader.
