# Weights for combining component scores into a single 0-100 candidate score
# (engine/decision_engine.py). Each block must sum to ~1.0; the engine normalizes
# regardless. Component scores themselves are normalized to 0-100 in scoring.py.

# `zone_fit` is NOT a block weight — it is a blend *inside* `technical`, mixing regime
# alignment with how well the strike sits in the ideal band computed by
# analytics/fair_value.py (expected move snapped to support/resistance). 0.0 = regime only
# (identical to the behaviour before the ideal-zone feature); 1.0 = strike placement only.
# `zone_fit` itself never gates — raising it only reorders the slate. Do not read that as
# "the ideal zone is inert": the same zone's `min_credit` IS a gate (risk_limits.yaml →
# income.require_vrp_edge). Different field, different job.

covered_call:
  iv: 0.30            # higher IV rank = richer premium = better
  technical: 0.25     # resistance proximity, trend (capped upside is OK in sideways)
  fundamental: 0.10   # less critical for CC (you already own it)
  liquidity: 0.15
  assignment_risk: 0.20   # lower assignment likelihood scores higher (we keep shares)
  sentiment: 0.05     # Reddit mention volume + upvote/keyword bias (conservative weight)
  zone_fit: 0.0       # share of `technical` given to ideal-zone strike placement
  relative_strength: 0.0  # RS component (Phase 3) – default off

cash_secured_put:
  iv: 0.30
  technical: 0.20     # support proximity matters for strike placement
  fundamental: 0.25   # must be a quality name we'd own
  liquidity: 0.15
  assignment_risk: 0.10   # assignment is acceptable here (we'd own it), so low weight
  sentiment: 0.05     # Reddit mention volume + upvote/keyword bias (conservative weight)
  zone_fit: 0.0       # share of `technical` given to ideal-zone strike placement
  relative_strength: 0.0  # RS component (Phase 3) – default off

# Minimum blended score (0-100) to surface a candidate to Claude / Telegram.
# Enforced in orchestrator/scan.py after the risk gate.
min_candidate_score: 55

# Score used for the IV component when a symbol has no IV rank (no/flat iv_history).
# Neutral by design: missing IV rank already passes the IV gate as "data unavailable";
# scoring it 0 under a 30% weight silently sank TQQQ/UPRO/MAGS/BAC (2026-09). 0 = old behaviour.
missing_iv_rank_score: 50

# Buy-to-own screen (strategies/buy_candidates.py): stocks worth acquiring to sell covered
# calls against. Without a floor + cap the screen surfaced EVERY non-held, non-bearish
# universe name (e.g. 46/46 over a weekend), so the "buy" count was meaningless.
buy_to_own:
  min_score: 60        # minimum blended score (0-100) to surface a buy-to-own candidate
  max_candidates: 10   # cap the number of buy-to-own names surfaced per scan

# NOTE: the number of candidates surfaced per run is governed by
# portfolio.max_new_positions_per_run in risk_limits.yaml (a single count cap for the
# whole pipeline). The former `top_n_for_claude` knob was redundant and has been removed.
