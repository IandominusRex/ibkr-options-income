# The value book (docs/superpowers/specs/2026-10-28-value-swing-book-design.md).
#
# Copy to config/value.yaml (git-ignored) to tune it. Parts 1-3 build the scorecard, the shadow
# record and its re-evaluations only: nothing here can place, size or gate an order.
#
# Everything under `rules:` can change a verdict, so it is hashed into the ruleset fingerprint
# (src/value/ruleset.py). Once `ruleset_version` is frozen, changing any rule is a version bump
# with a written reason, at most quarterly. v1 (2026-10-29) froze the entry rules after the
# calibration dry run; v2 (Part 2) adds `rules.exits` before the shadow ledger's first row and
# changes no entry rule; v3 (Part 3) adds `rules.reevaluation` (spec §7.1) and the exit engine's
# Part 3 rules (shock stops, the 8-K and going-concern thesis exits), and changes no entry rule.

ruleset_version: v3
db_url: sqlite:///data/value.db

universe:
  # Committed snapshots, each with its as-of date on the first line. Rebuild with
  # `python -m scripts.value_universe_snapshot`.
  trading_snapshot: config/value_universe.csv            # S&P 100
  evidence_snapshot: config/value_evidence_universe.csv  # S&P 500
  # A second share class of one filer is scored once, under its primary ticker.
  share_class_primary:
    GOOG: GOOGL
    FOX: FOXA
    NWS: NWSA

ticker_file:
  follow_days: 30            # a looked-up name outside the universe is refreshed this long
  mos_band_pts: 5.0          # a history row when the margin of safety crosses a 5-point band
  fair_value_change_pct: 1.0 # ... or fair value moves by more than 1%

research_sweep:
  enabled: true              # the research worker's nightly enqueue of filings and daily bars
  hour_et: 2

service:                     # scripts/run_value.py: no IBKR connection, no clientId
  run_hour_et: 6             # score once the 02:00 sweep has drained (ET)
  poll_seconds: 600          # how often the process checks whether a new session has closed
  market_facts_workers: 4    # parallel yfinance reads (market cap, next earnings)
  min_filings_coverage_pct: 90.0  # no night until the sweep has filings for 90% of the names

rules:
  data_quality:              # spec §6.3: a failure is UNKNOWN, never FAIL
    min_annual_periods: 5
    max_filing_age_days: 200
    market_cap_tolerance: 0.10
    min_price_sessions: 210
    stale_item_days: 200

  classification:            # spec §6.4-6.5
    bank_industries:
      - Diversified Banks
      - Regional Banks
      - Banks - Diversified
      - Banks - Regional
      - Consumer Finance
      - Investment Banking & Brokerage
    insurer_industries:
      - Property & Casualty Insurance
      - Multi-line Insurance
      - Reinsurance
      - Life & Health Insurance
      - Insurance - Property & Casualty
      - Insurance - Diversified
      - Insurance - Reinsurance
      - Insurance - Specialty
      - Insurance - Life
    combined_ratio_industries:
      - Property & Casualty Insurance
      - Multi-line Insurance
      - Reinsurance
      - Insurance - Property & Casualty
      - Insurance - Diversified
      - Insurance - Reinsurance
      - Insurance - Specialty
    reit_marker: REIT
    cyclical_industries:
      - Semiconductors
      - Semiconductor Materials & Equipment
      - Semiconductor Equipment & Materials
      - Steel
      - Copper
      - Gold
      - Commodity Chemicals
      - Chemicals
      - Fertilizers & Agricultural Chemicals
      - Agricultural Inputs
      - Integrated Oil & Gas
      - Oil & Gas Exploration & Production
      - Oil & Gas Equipment & Services
      - Oil & Gas Refining & Marketing
      - Oil & Gas Integrated
      - Oil & Gas E&P
      - Automobile Manufacturers
      - Auto Manufacturers
      - Homebuilding
      - Residential Construction
      - Construction Machinery & Heavy Transportation Equipment
      - Agricultural & Farm Machinery
      - Farm & Heavy Construction Machinery
      - Passenger Airlines
      - Airlines
    cyclical_fcf_margin_stdev_pts: 8.0
    preprofit_loss_years_min: 3

  health:                    # spec §6.4, operating companies: hard, a conjunction
    piotroski_min: 6
    altman_z_min: 1.8
    profitable_years_min: 4
    fcf_positive_years_min: 3
    net_debt_to_ebitda_max: 3.0
    interest_coverage_min: 4.0
    beneish_m_max: -1.78
    dilution_max_pct: 3.0
    assumed_interest_rate: 0.08  # implied coverage when interest expense is not tagged
    cyclical_profitable_years_min: 3
    cyclical_fcf_positive_years_min: 3

  banks:                     # spec §6.4, banks and insurers
    profitable_years_min: 4
    rote_median_min_pct: 10.0
    rote_stdev_max_pts: 4.0
    nco_multiple_max: 1.5
    require_cet1: false      # off: CET1 is untagged for 12 of 13 banks in companyfacts and no risk-weighted-assets concept exists to derive it (calibration dry run, 2026-10-29)
    cet1_min_pct: 6.5
    combined_ratio_max_pct: 100.0
    combined_ratio_years_min: 4

  valuation:                 # spec §6.5
    discount_rate_deep: 0.09
    discount_rate_growth: 0.08
    g_floor: 0.02
    terminal_growth: 0.025
    dcf_years: 10
    reverse_dcf_haircut: 0.7
    realised_cap_deep: 0.15
    realised_cap_growth: 0.20
    growth_sbc_share: 0.5
    terminal_value_max_share: 0.75

  quality_growth:            # spec §6.0, the entry rule
    revenue_cagr_min_pct: 10.0
    fcf_ps_cagr_min_pct: 10.0
    roic_median_min_pct: 15.0
    gross_margin_stdev_max_pts: 5.0

  margin_of_safety:          # spec §6.0 and §9.6, percent, by market regime
    deep_value: {normal: 25.0, cautious: 30.0, stressed: 35.0, crisis: 40.0}
    quality_growth: {normal: 10.0, cautious: 15.0, stressed: 20.0, crisis: 25.0}
    review_above_pct: 60.0

  timing:                    # spec §6.6
    earnings_window_sessions: 10
    recent_report_days: 70   # a report this recent dates the next one past the window
    rs_bottom_pct: 30.0
    low_lookback_sessions: 63
    new_low_window_sessions: 5

  exits:                     # spec §7: three policies shadowed side by side; percent where a %
    live_policy: value       # pre-registered (revision 3); full and hold12 are diagnostics only
    initial_stop_atr: 3.0    # full: average cost - 3 x ATR(14) ...
    initial_stop_max_pct: 15.0   # ... never wider than 15% below it
    arm_at_pct: 50.0         # full: the trail arms at entry + 50% of the way to fair value
    trail_atr: 3.0           # full: highest close - 3 x ATR(14), never below the average cost
    trail_atr_after_half: 2.0    # ... 2 x ATR(14) once half is sold
    half_sell_pct: 50.0      # full and value: sold at the first close at or above fair value
    peak_rsi_high: 75.0      # full: RSI(14) above 75 while armed ...
    peak_rsi_cross: 70.0     # ... then back below 70 sells the rest
    thesis_piotroski_max: 3  # every policy: F-score <= 3 is a thesis exit
    thesis_altman_z_below: 1.8   # ... Altman Z below 1.8 (distress)
    thesis_fv_below_price_pct: 90.0  # ... fair value below 90% of the price, under the 50-day SMA
    catastrophe_stop_pct: 30.0   # value and hold12: a close 30% below the average cost
    hold12_sessions: 252

  reevaluation:              # spec §7.1: when a held or shadow position's plan is re-evaluated
    abnormal_z: 3.0          # 1: |one-session return net of the sector ETF, in residual sds| (Major)
    raw_move_pct: 10.0       # ... a raw move this large when the history is too short (Major)
    drift_z: 3.0             # 2: |cumulative residual over drift_sessions| in the same units (Minor)
    drift_sessions: 5
    beta_sessions: 250       # the residual model's beta window, sessions before the day
    sigma_sessions: 60       # the residual's sd over the prior 60 sessions, the day excluded
    min_history_sessions: 120    # fewer aligned returns: the raw backstop only
    sector_etfs:             # GICS (snapshots) and yfinance sector names -> SPDR sector ETF
      Communication Services: XLC
      Consumer Discretionary: XLY
      Consumer Cyclical: XLY
      Consumer Staples: XLP
      Consumer Defensive: XLP
      Energy: XLE
      Financials: XLF
      Financial Services: XLF
      Health Care: XLV
      Healthcare: XLV
      Industrials: XLI
      Information Technology: XLK
      Technology: XLK
      Materials: XLB
      Basic Materials: XLB
      Real Estate: XLRE
      Utilities: XLU
    fallback_etf: SPY        # a sector the map lacks
    major_8k_items: ["1.03", "3.01", "4.02"]   # 4: bankruptcy, delisting, non-reliance (Major;
                                               # a thesis exit under every policy)
    minor_8k_items: ["1.01", "2.01", "2.05", "2.06", "4.01", "5.02"]   # deals, restructuring,
                                               # impairment, auditor, CEO/CFO (Minor)
    news_multiple: 4.0       # 5: 24-hour items >= 4 x the 30-day daily median ...
    news_min_items: 5        # ... and >= 5 items (Minor)
    regime_states: [stressed, crisis]          # 7: the market regime steps into one (Minor)
    quiet_days: 90           # 8: this many days with no re-evaluation (Minor)
    debounce_sessions: 3     # a trigger this close to an open re-evaluation joins it, unless Major
    down_shock_atr: 0.5      # full only: the stop rises to the shock low - 0.5 x ATR(14) before it
