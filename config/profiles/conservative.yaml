# Conservative profile — tighter delta/DTE windows, higher IV/score floors.
# Overlays on risk_limits.yaml (risk:) and scoring_weights.yaml (weights:).
risk:
  covered_call:
    delta_min: 0.20
    delta_max: 0.25   # tighter; default 0.35
    dte_min: 28       # slightly longer; default 21
    dte_max: 45
  cash_secured_put:
    delta_min: 0.15
    delta_max: 0.20   # tighter; default 0.30
    dte_min: 28
    dte_max: 45
  income:
    min_roc_pct: 1.5            # higher quality; default 1.0
    min_annualized_yield_pct: 18.0  # default 12.0
  iv:
    min_iv_rank: 40             # require richer premium; default 30
    min_iv_rv_ratio: 1.15       # tighter IV/RV gate; default 1.05

weights:
  min_candidate_score: 65       # raise score floor; default 55
