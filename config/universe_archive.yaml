# Archived tickers — names that were once in config/universe.yaml and have been deliberately
# removed because they are ones you've decided you'll clearly never trade.
#
# This file is REFERENCE-ONLY. Nothing in the application loads it — `src/common/config.py`
# only ever reads the four named config files (settings.yaml, risk_limits.yaml,
# scoring_weights.yaml, universe.yaml). Adding a ticker here has zero runtime effect; it exists
# purely so a removed name's reasoning is easy to find later instead of disappearing from the
# repo's history unexplained.
#
# To bring a ticker back: move its entry out of here and back into the appropriate section of
# universe.yaml (indexes/watchlist/would_own/sectors/strike_bands as applicable), and update
# UNIVERSE_RESEARCH.md and src/claude/prompts/strategist.py's _UNIVERSE_CONTEXT per CLAUDE.md's
# doc-update table.

