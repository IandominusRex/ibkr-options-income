# The scan universe and the CSP "would-own" allowlist.
# The system will ONLY recommend cash-secured puts on names in `would_own`.
#
# Tiers (for reference — all tiers scan for CCs):
#   Tier 1 — Core income: liquid, stable, fund-manager grade (SPY/QQQ/AAPL/MSFT/GOOGL/NVDA/JPM/GLD)
#   Tier 2 — Active income: elevated IV, real fundamentals (AMZN/AMD/META/PLTR/SOFI/HOOD/HIMS/BABA)
#   Tier 3 — Speculative / High-IV: premium income only, assignment is a risk event
#             Leveraged ETFs (SOXL/LABU/TSLL/DPST) — NEVER in would_own (daily-reset decay)
#             Individual speculative names (MARA/RGTI/CRCL) — CSP only with hard position limits
#
# Symbol rule: one ticker string feeds BOTH yfinance and IBKR, so only names with a single
# clean symbol belong here. Class shares like Berkshire-B (yfinance "BRK-B" vs IBKR "BRK B")
# do not resolve on both and are intentionally excluded.

# ── ETFs ──────────────────────────────────────────────────────────────────────

# Tier 1 — core ETF backbone
indexes:
  - SPY          # S&P 500; 0.8–2.5%/mo at 0.30Δ; most liquid
  - QQQ          # Nasdaq-100; slightly higher IV than SPY
  - IWM          # Russell 2000; better premiums, higher vol
  - SMH          # Semiconductor sector proxy; good OI
  - GLD          # Gold; decorrelates from equity drawdowns

  # Tier 1 — sector / diversifier ETFs (broaden away from the tech/growth/crypto tilt)
  - XLF          # Financials sector; strong options liquidity
  - XLK          # Technology sector
  - XLE          # Energy sector; commodity-linked, decorrelates from growth
  - XLV          # Healthcare sector; defensive
  - XLP          # Consumer staples; low-beta defensive
  - XLU          # Utilities; rate-sensitive defensive, decorrelates from tech
  - XLI          # Industrials; cyclical diversifier
  - TLT          # Long-duration Treasuries; rates/bond diversification (low IV — few signals)
  - SLV          # Silver; higher IV than GLD, commodity diversifier

  # Tier 2 — sector/thematic ETFs
  - HACK         # Cybersecurity ETF
  - IGV          # Software ETF

  # Tier 3 — elevated-IV thematic ETFs (CC-only — NOT in would_own)
  - ARKK         # Innovation basket; elevated IV
  - BITO         # Bitcoin futures ETF; high premiums; futures-roll decay → CC-only

  # Tier 3 — CC-only leveraged ETFs; NEVER add to would_own
  - SOXL         # 3× Semiconductor; annualized CC yields 180–530%; daily NAV decay
  - LABU         # 3× Biotech; binary FDA gap risk on top of leverage decay
  - TSLL         # 2× TSLA; affordable entry; high IV
  - DPST         # 3× Regional Banks; interest-rate sensitive; good CC premiums

# ── Individual stocks ─────────────────────────────────────────────────────────

watchlist:
  # Tier 1 — mega-cap, fund-manager grade
  - NVDA         # AI leader; IV 40–65; highest-premium Tier 1 name
  - AAPL         # Most liquid single-stock options; IV 22–35
  - MSFT         # Solid fundamentals; consistent premium; IV 22–32
  - GOOGL        # Liquid chains; search + AI moat; IV 25–38
  - AMZN         # Strong FCF; ~$205/sh; IV 28–42
  - JPM          # Best-in-class bank; financials diversifier; IV 22–35
  - V            # Visa; payments network moat; liquid options; lower IV (~20–28)
  - MA           # Mastercard; payments network moat; lower IV (~20–28)
  - WMT          # Walmart; defensive consumer staple; ~$120/sh; liquid options
  - HD           # Home Depot; quality retail; ~$327/sh; liquid options
  - COST         # Costco; defensive compounder — CC-focused (~$975/sh, large collateral)
  - LLY          # Eli Lilly; pharma leader — CC-focused (~$1,150/sh, large collateral)

  # Tier 2 — elevated IV, real fundamentals, assignment acceptable
  - TSLA         # Top single-stock income name; deepest liquidity after AAPL; IV 40–70
  - AMD          # Semiconductor peer; popular wheel stock; IV 40–60
  - META         # Exceptional premiums since 2023 recovery; IV 30–50
  - PLTR         # AI/defense; real revenue; IV rank ~47; ~$158/sh
  - SOFI         # Fintech turnaround; up 32% in 2026; ~$18/sh; IV 55–80
  - HOOD         # Retail brokerage; active options; ~$90/sh; IV 50–80
  - HIMS         # Telehealth growth; ±16% implied earnings move; IV 60–90
  - BABA         # Alibaba ADR; IV 40–55; NOTE: ADR delisting risk — size conservatively
  - NBIS         # Nebius Group; AI infrastructure/cloud; elevated IV
  - CRM          # Salesforce; enterprise software leader
  - UBER         # Mobility + delivery platform; liquid options
  - NET          # Cloudflare; cybersecurity and edge computing
  - CRWD         # CrowdStrike; cybersecurity leader
  - SNOW         # Snowflake; cloud data platform
  - TTD          # Trade Desk; digital advertising platform
  - DDOG         # Datadog; cloud monitoring and observability
  - TEM          # Tempus AI; healthcare AI platform

  # Tier 3 — speculative / high-IV; position size controlled by risk engine limits
  - MARA         # Bitcoin miner proxy; IV 90–130; BTC correlation = gap risk
  - RGTI         # Quantum computing; speculative; IV mean ~86; early stage
  - CRCL         # Circle/stablecoin IPO; IV ~170; down 57% from ATH; thin option liquidity
  - COIN         # Coinbase; liquid crypto-equity; high IV (cleaner expression than miners)
  - MSTR         # Strategy (MicroStrategy); leveraged-BTC proxy; very high IV — CC-only
  - RKLB         # Rocket Lab; space launch and satellite systems
  - ASTS         # AST SpaceMobile; satellite communications
  - IONQ         # Quantum computing

