[project]
name = "ibkr-income-system"
version = "0.1.0"
description = "Semi-autonomous options-income trading system for Interactive Brokers (covered calls + cash-secured puts), with Claude as the reasoning layer."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ib-async>=1.0.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "python-telegram-bot>=21.0",
    "yfinance>=0.2.40",
    "apscheduler>=3.10",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.36"]
sentiment = ["praw>=7.7", "vaderSentiment>=3.3", "curl_cffi>=0.7"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "pytest-timeout>=2.3", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Archive/ holds the deprecated Streamlit dashboard (not packaged, not tested).
extend-exclude = ["Archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 30
